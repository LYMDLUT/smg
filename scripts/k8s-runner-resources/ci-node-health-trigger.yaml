apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-node-health-trigger
  namespace: actions-runner-system
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Do not retry an ambiguous POST: GitHub may already have accepted it.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: ci-node-health-trigger
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: github-app
              secret:
                secretName: github-arc-secret
                defaultMode: 0440
                items:
                  - key: github_app_id
                    path: app-id
                  - key: github_app_installation_id
                    path: installation-id
                  - key: github_app_private_key
                    path: private-key.pem
          containers:
            - name: dispatch
              image: docker.io/library/python@sha256:a594f7e9df8a4c431265125b5f5d90cd1b81c8a8797fefee69d5b3544be11111
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: github-app
                  mountPath: /var/run/github-app
                  readOnly: true
              env:
                # Set to "true" in a one-off test Job to avoid issue changes.
                - name: DRY_RUN
                  value: "false"
                - name: WORKFLOW_REF
                  value: "main"
              command: [python3, -c]
              args:
                - |
                  import base64
                  import json
                  import os
                  import ssl
                  import subprocess
                  import sys
                  import time
                  import urllib.error
                  import urllib.parse
                  import urllib.request
                  from datetime import UTC, datetime
                  from pathlib import Path

                  POOLS = ("1-gpu-h100", "2-gpu-h100", "4-gpu-h100", "k8s-runner-cpu")


                  def api(method, path, token, body=None, *, base="https://api.github.com", context=None):
                      request = urllib.request.Request(
                          base + path,
                          data=json.dumps(body, ensure_ascii=False).encode() if body is not None else None,
                          headers={
                              "Authorization": f"Bearer {token}",
                              "Accept": "application/json",
                              "Content-Type": "application/json",
                              "X-GitHub-Api-Version": "2026-03-10",
                              "User-Agent": "smg-ci-node-health-trigger",
                          },
                          method=method,
                      )
                      try:
                          # Do not retry ambiguous writes or log token-bearing response bodies.
                          with urllib.request.urlopen(request, context=context, timeout=20) as response:
                              data = response.read()
                          return json.loads(data) if data else {}
                      except urllib.error.HTTPError as exc:
                          raise RuntimeError(f"{method} {path}: HTTP {exc.code}") from None
                      except (OSError, ValueError) as exc:
                          raise RuntimeError(f"{method} {path}: {type(exc).__name__}") from None


                  def summarize_runners(items):
                      pools = {name: {"name": name, "failed": 0, "examples": []} for name in POOLS}
                      for runner in items:
                          metadata = runner.get("metadata", {})
                          labels = metadata.get("labels", {})
                          status = runner.get("status", {})
                          if (
                              labels.get("actions.github.com/organization") != "smg-project"
                              or labels.get("actions.github.com/repository") != "smg"
                              or status.get("phase") != "Failed"
                          ):
                              continue
                          pool = pools.get(labels.get("actions.github.com/scale-set-name"))
                          if pool is None:
                              continue
                          pool["failed"] += 1
                          if len(pool["examples"]) < 3:
                              pool["examples"].append(
                                  {
                                      "name": str(metadata.get("name", ""))[:100],
                                      "reason": str(status.get("reason", ""))[:100],
                                      "message": str(status.get("message", ""))[:500],
                                  }
                              )
                      return list(pools.values())


                  def runner_snapshot():
                      try:
                          directory = Path("/var/run/secrets/kubernetes.io/serviceaccount")
                          token = (directory / "token").read_text().strip()
                          context = ssl.create_default_context(cafile=str(directory / "ca.crt"))
                          items = []
                          cursor = ""
                          seen = set()
                          while True:
                              params = {"limit": 200}
                              if cursor:
                                  params["continue"] = cursor
                              path = (
                                  "/apis/actions.github.com/v1alpha1/namespaces/actions-runner-system/"
                                  "ephemeralrunners?" + urllib.parse.urlencode(params)
                              )
                              page = api("GET", path, token, base="https://kubernetes.default.svc", context=context)
                              items.extend(page["items"])
                              cursor = page.get("metadata", {}).get("continue", "")
                              if not cursor:
                                  break
                              if cursor in seen:
                                  raise RuntimeError("Repeated pagination token")
                              seen.add(cursor)
                          return {"checked_at": datetime.now(UTC).isoformat(), "pools": summarize_runners(items)}
                      except Exception as exc:
                          # Never forward raw objects, response bodies, JIT config or credentials.
                          return {"error": f"Unable to list runner status ({type(exc).__name__})"}


                  def app_jwt(directory):
                      def encode(value):
                          return base64.urlsafe_b64encode(value).rstrip(b"=").decode()

                      now = int(time.time())
                      header = encode(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
                      claims = encode(
                          json.dumps(
                              {
                                  "iat": now - 60,
                                  "exp": now + 540,
                                  "iss": (directory / "app-id").read_text().strip(),
                              }
                          ).encode()
                      )
                      message = f"{header}.{claims}"
                      # The standard Python bookworm image supplies OpenSSL; no pip dependencies.
                      signature = subprocess.run(
                          ["openssl", "dgst", "-sha256", "-sign", str(directory / "private-key.pem")],
                          input=message.encode(),
                          capture_output=True,
                          check=True,
                          timeout=10,
                      ).stdout
                      return f"{message}.{encode(signature)}"


                  def serialize_snapshot(snapshot):
                      serialized = json.dumps(snapshot, ensure_ascii=False)
                      # Reserve space below GitHub's 65,535-character workflow input limit.
                      if len(serialized.encode()) > 48000:
                          return json.dumps({"error": "Runner snapshot exceeded dispatch size limit"})
                      return serialized


                  def main():
                      snapshot = serialize_snapshot(runner_snapshot())
                      directory = Path("/var/run/github-app")
                      installation = (directory / "installation-id").read_text().strip()
                      access = api(
                          "POST",
                          f"/app/installations/{installation}/access_tokens",
                          app_jwt(directory),
                          {
                              "repositories": ["smg"],
                              "permissions": {"actions": "write"},
                          },
                      )
                      token = access["token"]
                      try:
                          result = api(
                              "POST",
                              "/repos/smg-project/smg/actions/workflows/ci-node-health.yml/dispatches",
                              token,
                              {
                                  "ref": os.environ.get("WORKFLOW_REF", "main"),
                                  "inputs": {
                                      "dry_run": os.environ.get("DRY_RUN", "false"),
                                      "runner_failures_json": snapshot,
                                  },
                              },
                          )
                          print("Dispatch accepted:", result.get("html_url", "ci-node-health.yml"))
                          print("Runner snapshot:", snapshot)
                      finally:
                          api("DELETE", "/installation/token", token)


                  if __name__ == "__main__":
                      try:
                          main()
                      except Exception as exc:
                          # App/API failure messages deliberately exclude credentials and response bodies.
                          print(f"Trigger failed ({type(exc).__name__})", file=sys.stderr)
                          sys.exit(1)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-node-health-trigger
  namespace: actions-runner-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-node-health-trigger
  namespace: actions-runner-system
rules:
  - apiGroups: [actions.github.com]
    resources: [ephemeralrunners]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-node-health-trigger
  namespace: actions-runner-system
subjects:
  - kind: ServiceAccount
    name: ci-node-health-trigger
    namespace: actions-runner-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-node-health-trigger
