[package]
name = "prefetch-hint"
version = "0.1.0"
edition = "2021"
description = "A read-prefetch hint for batched memory access: never faults, sound for any pointer"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
publish = false

[dependencies]

# Not `lints.workspace = true`: the workspace denies unsafe code, and this crate exists to hold
# the one unsafe line (the prefetch instruction) behind a safe function.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
