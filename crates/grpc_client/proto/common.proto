syntax = "proto3";
package smg.grpc.common;

// =====================
// Tokenizer
// =====================

message GetTokenizerRequest {}

message GetTokenizerChunk {
  bytes data = 1;       // Raw zip bytes (concatenate all chunks)
  string sha256 = 2;    // SHA-256 fingerprint; set on final chunk only, empty on previous
}

// =====================
// KV Cache Events
// =====================

message SubscribeKvEventsRequest {
  // Resume from this sequence number (0 = start from current state).
  uint64 start_sequence_number = 1;
}

message KvEventBatch {
  uint64 sequence_number = 1;
  double timestamp = 2;
  repeated KvCacheEvent events = 3;
  optional int32 dp_rank = 4;
}

message KvCacheEvent {
  uint64 event_id = 1;
  oneof data {
    KvBlocksStored stored = 2;
    KvBlocksRemoved removed = 3;
    KvCacheCleared cleared = 4;
  }
}

// Storage tier of a KV block, from the engine's `medium` (vLLM: GPU, CPU,
// STORAGE; SGLang: GPU, CPU_PINNED, DISK, EXTERNAL). `KvBlock.cache_level`
// mirrors it for older consumers: 0 device, 1 host, 2 disk, 3 external; a
// block with neither set is on the device.
enum KvCacheTier {
  KV_CACHE_TIER_UNSPECIFIED = 0;
  KV_CACHE_TIER_DEVICE = 1;
  KV_CACHE_TIER_HOST = 2;
  KV_CACHE_TIER_DISK = 3;
  KV_CACHE_TIER_EXTERNAL = 4;
}

// Where the publishing engine says the blocks live relative to itself. Only
// local blocks belong in a per-worker prefix index; remote ones describe a
// shared pool.
enum KvCacheLocality {
  KV_CACHE_LOCALITY_UNSPECIFIED = 0;
  KV_CACHE_LOCALITY_LOCAL = 1;
  KV_CACHE_LOCALITY_REMOTE = 2;
}

message KvBlocksStored {
  repeated KvBlock blocks = 1;
  optional int64 parent_block_hash = 2;
  // Tier the blocks were stored in (see KvCacheTier) and the engine's raw
  // medium string it was derived from.
  optional KvCacheTier tier = 3;
  optional string medium = 4;
  // KV cache group the blocks belong to (hybrid models publish one group per
  // attention kind; only full-attention groups feed a prefix index).
  optional uint32 group_idx = 5;
  optional string kv_cache_spec_kind = 6;
  optional uint32 kv_cache_spec_sliding_window = 7;
  optional KvCacheLocality locality = 8;
  // Who manages the blocks: the engine itself, or a residency agent.
  optional string ownership = 9;
  // Request context that stored the blocks (attribution only).
  optional string session_id = 10;
  // Cache namespace: LoRA adapter and cache salt the block hashes were
  // computed under. Consumers fold them into their own content hashes.
  optional string lora_name = 11;
  optional string cache_salt = 12;
}

// One entry of vLLM's per-block `extra_keys`: the inputs beyond token ids
// that went into the block hash, published untagged (a LoRA name or cache
// salt as text, multimodal items as (identifier, offset), digests as bytes).
message KvBlockExtraKey {
  oneof key {
    string text = 1;
    bytes blob = 2;
    int64 number = 3;
    KvMultimodalKey multimodal = 4;
  }
}

message KvMultimodalKey {
  string identifier = 1;
  int64 offset = 2;
}

message KvBlock {
  int64 block_hash = 1;
  repeated uint32 token_ids = 2;
  int32 block_size = 3;
  optional int64 lora_id = 4;
  optional int32 cache_level = 5;
  repeated KvBlockExtraKey extra_keys = 6;
}

message KvBlocksRemoved {
  repeated int64 block_hashes = 1;
  optional int32 cache_level = 2;
  optional KvCacheTier tier = 3;
  optional string medium = 4;
  optional uint32 group_idx = 5;
  optional KvCacheLocality locality = 6;
  optional string ownership = 7;
}

message KvCacheCleared {
  optional string ownership = 1;
}

// =====================
// Admin Operations
// =====================

message FlushCacheRequest {
  // Seconds to wait for the scheduler to go idle before flushing.
  // 0 = flush immediately (fails if requests are in flight).
  float timeout_s = 1;
}

message FlushCacheResponse {
  bool success = 1;
  string message = 2;
}

message StartProfileRequest {
  // Directory where profiler traces are written (backend default if unset).
  optional string output_dir = 1;
  // Forward step at which profiling starts (immediately if unset).
  optional int32 start_step = 2;
  // Number of forward steps to profile (until StopProfile if unset).
  optional int32 num_steps = 3;
  // Profiler activities, e.g. "CPU", "GPU", "MEM". Backend default if empty.
  repeated string activities = 4;
  optional bool with_stack = 5;
  optional bool record_shapes = 6;
  bool profile_by_stage = 7;
}

message StopProfileRequest {}

message ProfileResponse {
  bool success = 1;
  string message = 2;
}

// =====================
// Multimodal Tensor Transport
// =====================
//
// Out-of-band transport descriptors for large multimodal tensor payloads,
// shared by every engine's TensorData. The raw tensor bytes live in exactly
// one transport; the engine's TensorData carries shape and dtype.

message ShmHandle {
  string name = 1;
  uint64 offset = 2;
  uint64 nbytes = 3;
  // Producer/lifetime owner. Used by implementations to coordinate cleanup.
  string owner_id = 4;
}

message RemoteTensorHandle {
  // Examples: "nixl", "ucx", "object_store".
  string transport = 1;
  bytes descriptor = 2;
  uint64 nbytes = 3;
}

// Multimodal input modality, shared across engine protos so the servicers can
// route each request to the matching encoder (image vs video vs audio).
enum Modality {
  MODALITY_UNSPECIFIED = 0;
  IMAGE = 1;
  AUDIO = 2;
  VIDEO = 3;
}
